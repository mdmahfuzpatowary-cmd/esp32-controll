<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Smart Control</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons for Plug Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="dashboard-card">
        <!-- Header Section -->
        <div class="header">
            <div class="title-area">
                <h1>ESP32 Smart Control</h1>
                <p>Device: ESP32 · Monitoring Dashboard</p>
            </div>
            <span class="status-badge">Online</span>
        </div>

        <!-- Controls Grid -->
        <div class="grid-container">
            <!-- Load 1 -->
            <div class="card" id="card-1">
                <div class="icon"><i class="fa-solid fa-plug"></i></div>
                <h2>Load 1</h2>
                <span class="badge badge-on" id="badge-1">ON</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-1" checked onchange="toggleLoad(1)">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Load 2 -->
            <div class="card" id="card-2">
                <div class="icon"><i class="fa-solid fa-plug"></i></div>
                <h2>Load 2</h2>
                <span class="badge badge-off" id="badge-2">OFF</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-2" onchange="toggleLoad(2)">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Load 3 -->
            <div class="card" id="card-3">
                <div class="icon"><i class="fa-solid fa-plug"></i></div>
                <h2>Load 3</h2>
                <span class="badge badge-on" id="badge-3">ON</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-3" checked onchange="toggleLoad(3)">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Load 4 -->
            <div class="card" id="card-4">
                <div class="icon"><i class="fa-solid fa-plug"></i></div>
                <h2>Load 4</h2>
                <span class="badge badge-off" id="badge-4">OFF</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-4" onchange="toggleLoad(4)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
